<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a1f"/>
      <stop offset="60%" stop-color="#121033"/>
      <stop offset="100%" stop-color="#062e24"/>
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="20" fill="url(#bgGrad1)"/>
  <rect x="1" y="1" width="598" height="378" rx="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top App Header / Bar -->
  <rect x="25" y="22" width="550" height="42" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="45" cy="43" r="5" fill="#ef4444"/>
  <circle cx="62" cy="43" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  
  <text x="110" y="48" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#a78bfa" letter-spacing="1">NURINVEST // CAPITAL DASHBOARD</text>
  <rect x="475" y="30" width="85" height="26" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
  <text x="517" y="47" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">LIVE ROI</text>

  <!-- Main KPI Left Block -->
  <rect x="25" y="78" width="220" height="115" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="42" y="105" font-family="'Montserrat', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Jami Jalb Qilingan</text>
  <text x="42" y="148" font-family="'Unbounded', sans-serif" font-size="30" font-weight="800" fill="#ffffff">$250,000+</text>
  <rect x="42" y="162" width="75" height="20" rx="6" fill="rgba(16,185,129,0.2)"/>
  <text x="79" y="176" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">&#9650; +100% KPI</text>

  <!-- KPI Right Block -->
  <rect x="260" y="78" width="315" height="115" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- Mini stats inside right block -->
  <text x="280" y="105" font-family="'Montserrat', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Investorlar Portfeli</text>
  <text x="280" y="136" font-family="'Unbounded', sans-serif" font-size="20" font-weight="700" fill="#38bdf8">30+ Yirik Investor</text>
  <text x="280" y="158" font-family="'Montserrat', sans-serif" font-size="11" fill="#cbd5e1">O'rtacha chek: <tspan font-weight="700" fill="#34d399">$10,000 / ta</tspan></text>
  <text x="280" y="176" font-family="'Montserrat', sans-serif" font-size="11" fill="#cbd5e1">Bitimlar yopilishi: <tspan font-weight="700" fill="#a78bfa">100% ishonch</tspan></text>

  <!-- Growth Chart Container -->
  <rect x="25" y="208" width="550" height="150" rx="14" fill="rgba(15,13,38,0.7)" stroke="rgba(255,255,255,0.06)"/>

  <!-- Chart Grid Lines -->
  <line x1="45" y1="240" x2="555" y2="240" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <line x1="45" y1="280" x2="555" y2="280" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <line x1="45" y1="320" x2="555" y2="320" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>

  <!-- Chart Axis Labels -->
  <text x="45" y="343" font-family="'Montserrat', sans-serif" font-size="10" fill="#64748b">Fev</text>
  <text x="145" y="343" font-family="'Montserrat', sans-serif" font-size="10" fill="#64748b">Apr</text>
  <text x="250" y="343" font-family="'Montserrat', sans-serif" font-size="10" fill="#64748b">Iyun</text>
  <text x="355" y="343" font-family="'Montserrat', sans-serif" font-size="10" fill="#64748b">Avg</text>
  <text x="455" y="343" font-family="'Montserrat', sans-serif" font-size="10" fill="#64748b">Okt</text>
  <text x="535" y="343" font-family="'Montserrat', sans-serif" font-size="10" fill="#34d399" font-weight="700">Dek $250K</text>

  <!-- Area Gradient Fill -->
  <path d="M 45 325 Q 145 310, 250 280 T 455 240 T 545 220 L 545 330 L 45 330 Z" fill="url(#areaGrad)"/>

  <!-- Main Trend Line -->
  <path d="M 45 325 Q 145 310, 250 280 T 455 240 T 545 220" fill="none" stroke="url(#chartLineGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Pulse Circles on Milestones -->
  <circle cx="250" cy="280" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="455" cy="240" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="545" cy="220" r="6" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
</svg>
